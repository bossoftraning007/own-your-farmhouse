name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Generates QR codes, WebP images, the OG image and the sitemap, then
      # fails the build if any image the site references is missing or if a
      # retired domain has reappeared anywhere in the bundle.
      - name: Build
        run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ""
          VITE_FORMSPREE_ENDPOINT: ""